    name: "New Year's Day"
  - date: "2026-07-04"
    name: "Independence Day (observed, sample)"
  - date: "2026-11-26"
    name: "Thanksgiving (sample)"
  - date: "2026-12-25"
    name: "Christmas Day"
cutoffs:
  usd_correspondent_processing:
    local_time: "18:00"
    note: "Illustrative USD correspondent cut-off for a SGD->USD->INR hop."
